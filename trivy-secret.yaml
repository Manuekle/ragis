# Trivy secret-scanner config. Trivy loads ./trivy-secret.yaml by default, so the
# supply-chain job in .github/workflows/ci.yml picks this up without a flag.
#
# Keep every entry scoped to one path and say why it is not a real secret.
allow-rules:
  # The anthropic SDK (ai-gateway dependency, present in the rag-engine and
  # ingest-worker venvs) has docstrings that quote `{"type": "service_account"}`,
  # which matches the built-in gcp-service-account rule (11 CRITICAL hits in
  # anthropic 2.6.0, still present in 2.11.0). No key material is there.
  - id: anthropic-sdk-docstrings
    description: 'anthropic SDK docstrings quote {"type": "service_account"}, not a GCP key'
    path: .*/site-packages/anthropic/.*
