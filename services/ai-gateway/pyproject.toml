[project]
name = "ragsis-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "ragsis-core",
  "httpx>=0.27",
  "boto3>=1.35",
  "anthropic[bedrock]>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragsis_ai"]

[tool.uv.sources]
ragsis-core = { workspace = true }
