[project]
name = "ragsis-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "ragsis-core",
  "ragsis-ai",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragsis_rag"]

[tool.uv.sources]
ragsis-core = { workspace = true }
ragsis-ai = { workspace = true }
