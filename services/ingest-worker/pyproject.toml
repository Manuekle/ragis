[project]
name = "ragsis-ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "ragsis-core",
  "ragsis-ai",
  "pypdf>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragsis_ingest"]

[tool.uv.sources]
ragsis-core = { workspace = true }
ragsis-ai = { workspace = true }
