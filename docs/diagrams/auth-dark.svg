<text x="24.0" y="556.0" font-size="11" font-weight="400" fill="#aeaeb5" text-anchor="start">The id_token never reaches JavaScript: it lives in an httpOnly cookie. &quot;Forgot your password?&quot; uses ForgotPassword; the code arrives by email.</text>
