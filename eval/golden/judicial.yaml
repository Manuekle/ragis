# Judicial vertical: a law firm's file for expediente D-16.857 (Sentencia C-217 de 2026, Corte Constitucional).
# The sentence PDF is the real public decision; the other documents are fictional and generated by
# eval/corpus/judicial/build_corpus.py. Each question targets one format (PDF text and tables, DOCX, XLSX, PPTX, TXT,
# HTML), the permission boundary (a confidential memo for partners only), abstention, or a multi-hop link between two
# documents.
#
#   uv run python -m ragsis_eval.run --golden eval/golden/judicial.yaml
version: 1
tenants:
  judicial:
    name: Ortiz Lozano Abogados (eval)
    groups: [Socios]
    users:
      owner: {email: socia@ortizlozano.eval, role: owner, groups: [Socios]}
      analyst: {email: asociado@ortizlozano.eval, role: member, workspace_role: reader}
    documents:
      - {file: judicial/sentencia-C-217-26.pdf, title: Sentencia C-217 de 2026}
      - {file: judicial/correccion-demanda.docx, title: Escrito de corrección de la demanda}
      - {file: judicial/cronologia-expediente.xlsx, title: Cronología del expediente}
      - {file: judicial/estrategia-post-fallo.pptx, title: Estrategia después del fallo}
      - {file: judicial/acta-reunion-cliente.txt, title: Acta de reunión con el cliente}
      - {file: judicial/boletin-jurisprudencia.html, title: Boletín de jurisprudencia laboral}
      - {file: judicial/memorando-honorarios.docx, title: Memorando confidencial de honorarios, acl_groups: [Socios]}
    graph: true

questions:
  # --- PDF: the sentence (body text, tables and signature page) ---
  - {id: j01, tenant: judicial, user: owner,
     question: "¿Qué decidió la Corte Constitucional en la Sentencia C-217 de 2026 sobre el parágrafo del artículo 1 de la Ley 1010 de 2006?",
     expect: {answerable: true, contains: ["ineptitud sustantiva"], doc: Sentencia C-217 de 2026}}
  - {id: j02, tenant: judicial, user: analyst, question: "¿Quién fue el magistrado ponente de la Sentencia C-217 de 2026?",
     expect: {answerable: true, contains: ["Camargo Assis"], doc: Sentencia C-217 de 2026}}
  - {id: j03, tenant: judicial, user: owner,
     question: "¿En qué fecha aprobó la plenaria del Senado el texto definitivo del proyecto que se convirtió en la Ley 2528 de 2025?",
     expect: {answerable: true, contains: ["12 de marzo de 2025"], doc: Sentencia C-217 de 2026}}
  - {id: j04, tenant: judicial, user: analyst, question: "¿Qué magistrado estuvo ausente con excusa en la Sentencia C-217 de 2026?",
     expect: {answerable: true, contains: ["Polo Rosero"], doc: Sentencia C-217 de 2026}}
  - {id: j05, tenant: judicial, user: owner, question: "¿Quiénes pidieron suspender el proceso por prejudicialidad?",
     expect: {answerable: true, contains: ["Defensoría del Pueblo"], doc: Sentencia C-217 de 2026}}
  - {id: j06, tenant: judicial, user: analyst,
     question: "¿Quiénes fueron las coordinadoras ponentes del proyecto en la Cámara para el primer debate?",
     expect: {answerable: true, contains: ["Mary Anne Perdomo"], doc: Sentencia C-217 de 2026}}

  # --- DOCX: corrected claim ---
  - {id: j07, tenant: judicial, user: owner, question: "¿Cuántos folios tiene el escrito de corrección de la demanda?",
     expect: {answerable: true, contains: ["14"], doc: Escrito de corrección de la demanda}}
  - {id: j08, tenant: judicial, user: analyst,
     question: "¿Cuántos contratos de prestación de servicios vigentes había en 2024 en entidades del orden nacional según la demanda?",
     expect: {answerable: true, contains: ["412.600"], doc: Escrito de corrección de la demanda}}
  - {id: j09, tenant: judicial, user: owner,
     question: "¿En qué plazo pidió el demandante que el Ministerio del Trabajo reglamentara la aplicación de las normas sobre acoso laboral?",
     expect: {answerable: true, contains: ["seis meses"], doc: Escrito de corrección de la demanda}}

  # --- XLSX: timeline, interveners and hours ---
  - {id: j10, tenant: judicial, user: analyst,
     question: "¿Quién era el responsable del seguimiento del auto que admitió la demanda y decretó pruebas?",
     expect: {answerable: true, contains: ["Tomás Rengifo"], doc: Cronología del expediente}}
  - {id: j11, tenant: judicial, user: owner, question: "¿Cuántas horas ha registrado Tomás Rengifo Bernal en el caso?",
     expect: {answerable: true, contains: ["118"], doc: Cronología del expediente}}
  - {id: j12, tenant: judicial, user: owner, question: "¿Cuál es la tarifa por hora de la socia Mariana Ortiz Lozano?",
     expect: {answerable: true, contains: ["450"], doc: Cronología del expediente}}

  # --- PPTX: strategy deck (bullets and a table) ---
  - {id: j13, tenant: judicial, user: owner,
     question: "¿Qué probabilidad estimó el comité para el escenario en que la Ley 2528 de 2025 sea declarada inexequible?",
     expect: {answerable: true, contains: ["15"], doc: Estrategia después del fallo}}
  - {id: j14, tenant: judicial, user: analyst, question: "¿Cuándo es la próxima revisión del comité de litigio del caso Parra Rosas?",
     expect: {answerable: true, contains: ["15 de octubre de 2026"], doc: Estrategia después del fallo}}

  # --- TXT: meeting minutes ---
  - {id: j15, tenant: judicial, user: owner, question: "¿Por qué el cliente descartó solicitar la nulidad de la sentencia?",
     expect: {answerable: true, contains: ["costos"], doc: Acta de reunión con el cliente}}
  - {id: j16, tenant: judicial, user: analyst, question: "¿Cuándo debe enviarse el primer informe trimestral al cliente?",
     expect: {answerable: true, contains: ["30 de octubre de 2026"], doc: Acta de reunión con el cliente}}

  # --- HTML: newsletter with a table ---
  - {id: j17, tenant: judicial, user: owner,
     question: "¿Cuántas quejas por acoso laboral presentaron contratistas de prestación de servicios en el primer semestre de 2026?",
     expect: {answerable: true, contains: ["587"], doc: Boletín de jurisprudencia laboral}}
  - {id: j18, tenant: judicial, user: analyst, question: "¿Qué número tiene el boletín de jurisprudencia laboral de agosto de 2026?",
     expect: {answerable: true, contains: ["47"], doc: Boletín de jurisprudencia laboral}}

  # --- permissions: the fee memo is for partners only ---
  - {id: j19, tenant: judicial, user: analyst, acl_case: true,
     question: "¿Cuál es el presupuesto aprobado para la nueva demanda del caso Parra Rosas?",
     expect: {answerable: false, must_not_contain: ["27.500.000", "27500000", "42.000.000"]}}
  - {id: j20, tenant: judicial, user: owner, question: "¿Cuál es el presupuesto aprobado para la nueva demanda del caso Parra Rosas?",
     expect: {answerable: true, contains: ["27.500.000"], doc: Memorando confidencial de honorarios}}

  # --- no answer in the file ---
  - {id: j21, tenant: judicial, user: owner, question: "¿A cuánto ascendió la condena en costas impuesta al demandante?",
     expect: {answerable: false}}
  - {id: j22, tenant: judicial, user: analyst, question: "¿Cuál es el número de teléfono del demandante Juan Felipe Parra Rosas?",
     expect: {answerable: false}}

  # --- multi-hop: the answer needs one chunk from each document ---
  - {id: j23, tenant: judicial, user: owner,
     question: "¿Qué condición debe cumplirse antes de radicar la nueva demanda que autorizó el cliente?",
     expect: {answerable: true, contains: ["ratific"], docs: [Acta de reunión con el cliente, Sentencia C-217 de 2026]}, multi_hop: true}
  - {id: j24, tenant: judicial, user: owner,
     question: "¿Quién es responsable de la nueva demanda y cuántas horas ha registrado en el caso?",
     expect: {answerable: true, contains: ["Mariana Ortiz", "64"], docs: [Estrategia después del fallo, Cronología del expediente]}, multi_hop: true}
